name: geotrace_capture
description: GeoTrace GIS field capture app with GNSS, offline queue and AR overlay prototype.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  geolocator: ^14.1.1
  path_provider: ^2.1.3
  path: ^1.9.0
  sqflite: ^2.3.3
  connectivity_plus: ^6.0.3
  http: ^1.2.1
  uuid: ^4.4.0
  crypto: ^3.0.3
  ar_flutter_plugin_plus: ^1.0.1
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
